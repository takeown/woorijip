name: Release production

on:
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml

  deploy:
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ github.sha }}
