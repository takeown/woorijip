name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web
        run: pnpm lint:web

      - name: Build web
        run: pnpm build:web

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build and test API
        working-directory: apps/api
        run: ./gradlew build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        run: docker compose config -q

  ci:
    if: ${{ always() }}
    needs:
      - web
      - api
      - compose
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify all CI jobs succeeded
        env:
          WEB_RESULT: ${{ needs.web.result }}
          API_RESULT: ${{ needs.api.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
        run: |
          test "$WEB_RESULT" = success
          test "$API_RESULT" = success
          test "$COMPOSE_RESULT" = success
