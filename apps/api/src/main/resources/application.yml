spring:
  application:
    name: woorijip-api
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret}
            scope: openid,profile,email
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/woorijip}
    username: ${DATABASE_USERNAME:woorijip}
    password: ${DATABASE_PASSWORD:woorijip}
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

app:
  auth:
    allowed-google-emails: ${GOOGLE_ALLOWED_EMAILS:}
    bootstrap-household-name: ${BOOTSTRAP_HOUSEHOLD_NAME:우리집}
    web-url: ${WEB_URL:http://localhost:3100}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3100}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.6-luna}
    safety-identifier-secret: ${OPENAI_SAFETY_IDENTIFIER_SECRET:}
    analysis-daily-request-limit: ${OPENAI_ANALYSIS_DAILY_REQUEST_LIMIT:20}
    analysis-transaction-limit: ${OPENAI_ANALYSIS_TRANSACTION_LIMIT:200}
    analysis-max-output-tokens: ${OPENAI_ANALYSIS_MAX_OUTPUT_TOKENS:500}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        max-age: 30d
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
