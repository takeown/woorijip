spring:
  application:
    name: woorijip-api
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret}
            scope: openid,profile,email
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/woorijip}
    username: ${DATABASE_USERNAME:woorijip}
    password: ${DATABASE_PASSWORD:woorijip}

app:
  auth:
    allowed-google-emails: ${GOOGLE_ALLOWED_EMAILS:}
    bootstrap-household-name: ${BOOTSTRAP_HOUSEHOLD_NAME:우리집}
    web-url: ${WEB_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${PORT:8080}
